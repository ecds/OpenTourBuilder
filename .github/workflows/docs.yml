# Builds the docs site and publishes it to GitHub Pages whenever
# anything under docs/ changes on the main branch.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A fixed Python image, so the build doesn't depend on what GitHub
    # installs on its runners.
    container: python:3.13-slim
    steps:
      # The theme needs git, which the slim image leaves out. Installing it
      # first also makes checkout produce a real git repository.
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v7
      # The checkout belongs to a different user than the container, so git
      # won't read it until it's marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
