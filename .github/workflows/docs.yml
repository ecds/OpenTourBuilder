# Builds the docs site and publishes it to GitHub Pages whenever
# anything under docs/ changes on the develop branch.
name: Docs

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A fixed Python image, so the build doesn't depend on what GitHub
    # installs on its runners.
    container: python:3.13-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
